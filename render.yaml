services:
  - type: web
    name: sentivo
    env: python
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      cd ../frontend &&
      npm ci &&
      npm run build
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # set this manually in the Render dashboard
      - key: GEMINI_MODEL_NAME
        value: gemini-2.5-flash
